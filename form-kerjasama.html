<!-- HEADER -->
<section class="section bg-dark text-white text-center">
  <div class="container">
    <h1>Form Pengajuan Kerja Sama</h1>
    <p class="lead">
      Untuk kontraktor, distributor, developer, investor, dan mitra proyek
    </p>
  </div>
</section>

<!-- FORM -->
<section class="section form-kerjasama">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">

            <h3 class="mb-4 text-center">Data Pengajuan Kerja Sama</h3>

            <form id="kerjasamaForm">

              <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="nama" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Nama Perusahaan / Instansi</label>
                <input type="text" class="form-control" id="perusahaan" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Nomor WhatsApp</label>
                <input type="tel" class="form-control" id="wa" placeholder="08xxxxxxxxxx" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Jenis Kerja Sama</label>
                <select class="form-select" id="jenis">
                  <option>Kontraktor / Proyek</option>
                  <option>Distributor / Reseller</option>
                  <option>Developer / Properti</option>
                  <option>Investor / Partner</option>
                  <option>Lainnya</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="form-label">Keterangan / Kebutuhan</label>
                <textarea class="form-control" id="keterangan" rows="4"
                  placeholder="Jelaskan kebutuhan proyek, volume, lokasi, dll"></textarea>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-danger btn-lg">
                  Kirim Pengajuan via WhatsApp
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer text-center">
  <div class="container">
    <p class="mb-0">© 2026 Putra Roster Beton Indonesia</p>
  </div>
</footer>

<!-- WA FLOAT -->
<a href="https://wa.me/6283863583008" class="wa-float">
  <img src="assets/images/whatsapp.jpg" alt="WhatsApp">
</a>

<!-- JS -->
<script>
document.getElementById("kerjasamaForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const nama = document.getElementById("nama").value;
  const perusahaan = document.getElementById("perusahaan").value;
  const wa = document.getElementById("wa").value;
  const jenis = document.getElementById("jenis").value;
  const ket = document.getElementById("keterangan").value;

  const pesan = `Halo Putra Roster Beton Indonesia,%0A%0A`
    + `Saya ingin mengajukan kerja sama dengan detail berikut:%0A`
    + `Nama: ${nama}%0A`
    + `Perusahaan: ${perusahaan}%0A`
    + `WhatsApp: ${wa}%0A`
    + `Jenis Kerja Sama: ${jenis}%0A`
    + `Keterangan: ${ket}`;

  window.open(`https://wa.me/6283863583008?text=${pesan}`, "_blank");
});
</script>

</body>
