  <script>
fetch("data/blog.json")
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById("articleList");
    if (!list) return;

    list.innerHTML = data.posts.map(p => `
      <article class="blog-card">
        <img src="${p.image}" alt="${p.title}">
        <div class="blog-card-body">
          <div class="blog-meta">
            📅 ${p.date} • 🏷️ ${p.category}
          </div>
          <h3>
            <a href="blog/${p.slug}.html">${p.title}</a>
          </h3>
          <p class="blog-excerpt">
            ${p.excerpt || "Artikel seputar material bangunan dan tips konstruksi."}
          </p>
          <a href="blog/${p.slug}.html" class="blog-readmore">
            Baca selengkapnya →
          </a>
        </div>
      </article>
    `).join("");
  });
</script>
  <script>
document.getElementById("submitForm").addEventListener("submit", e => {

  const reader = new FileReader();

  reader.onload = () => {
    const slug = title.value.toLowerCase().replace(/[^a-z0-9]+/g, "-");

    const html = `
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>${title.value} | Putra Roster Beton Indonesia</title>

  </div>
</section>

  <div class="container">
    <img src="${reader.result}" style="width:100%;border-radius:16px;margin-bottom:20px">
    <p>${content.value.replace(/\n/g, "<br>")}</p>
    <a href="../artikel.html">← Kembali ke Artikel</a>
  </div>
</section>

</body>
</html>
`;

    const blob = new Blob([html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slug + ".html";
    a.click();

    alert("Artikel HTML berhasil digenerate!\nUpload ke folder /blog/");
  };

  reader.readAsDataURL(file);
});
</script>
